name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chamada por deploy.yml: publicar só depois de lint, typecheck e testes passarem.
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (prettier)
        run: npx prettier --check .

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # O binário direto, e não a gitleaks-action: a action varre um intervalo
      # `<commit>^..HEAD` e quebra quando o intervalo inclui o commit inicial
      # (que não tem pai). Aqui varremos o histórico inteiro, sempre.
      - name: Instalar gitleaks
        env:
          VERSAO: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Varredura de segredos (histórico completo)
        run: gitleaks git --redact --verbose --exit-code 1
